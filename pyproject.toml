[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "lux_template"
dynamic = ["version"]
description = "Awesome lux_template created by LiTTY-FYDP"
readme = "README.md"
requires-python = ">=3.14"
license = "Unlicense"
license-files = ["LICENSE"]
authors = [{ name = "LiTTY-FYDP" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/LiTTY-FYDP/lux-template/"
Repository = "https://github.com/LiTTY-FYDP/lux-template/"
Changelog = "https://github.com/LiTTY-FYDP/lux-template/blob/main/HISTORY.md"

[project.scripts]
lux_template = "lux_template.__main__:main"

[project.optional-dependencies]
test = [
    "coverage[toml]",
    "pytest",
    "pytest-cov",
]
dev = [
    "coverage[toml]",
    "gitchangelog",
    "mkdocs",
    "pytest",
    "pytest-cov",
    "ruff",
    "ty",
]

[tool.setuptools.dynamic]
version = { file = ["lux_template/VERSION"] }

[tool.setuptools.packages.find]
include = ["lux_template*"]
exclude = ["tests*", ".github*"]

[tool.setuptools.package-data]
lux_template = ["VERSION"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["lux_template", "tests"]
preview = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
    "D203",
    "D213",
    "ISC001",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
mypy-init-return = true

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.14"
root = ["."]

[tool.ty.rules]
all = "error"

[tool.ty.src]
include = ["lux_template", "tests"]

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
addopts = [
    "-v",
    "--cov=lux_template",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-report=html",
    "-l",
    "--tb=short",
    "--maxfail=1",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["lux_template"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
